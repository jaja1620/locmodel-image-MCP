[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "locmodel-image"
version = "3.0.0"
description = "Zero-dependency bridge that exposes a local LocModel / stable-diffusion.cpp image engine as an MCP server and CLI, with prompt-to-image and mask-based region editing"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "locmodel-image contributors" }]
keywords = ["mcp", "stable-diffusion", "locmodel", "image-generation", "image-editing", "inpainting", "offline", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Multimedia :: Graphics",
]

[project.urls]
Homepage = "https://github.com/jaja1620/locmodel-image-MCP"

[project.scripts]
locmodel-image = "locmodel_image:main"
locmodel-image-mcp = "locmodel_mcp:main"

[tool.setuptools]
package-dir = { "" = "scripts" }
py-modules = ["locmodel_image", "locmodel_mcp", "locmodel_edit"]
